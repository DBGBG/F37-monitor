# MOXA 主动运维监控系统 - 设备清单
# 在此配置所有需要监控的交换机和服务器

# ========== MOXA 交换机 (IP 范围批量定义) ==========
switch_groups:
  - group_name: "A网段交换机"
    ip_range: "10.51.200.1-10.51.200.200"
    model: "MOXA"
    location_prefix: "A网段"
    snmp:
      version: "v2c"
      community: "public"
    ssh:
      username: "admin"
      password: "admin123"
      port: 22
    enabled: true

  - group_name: "B网段交换机"
    ip_range: "10.50.200.1-10.50.200.200"
    model: "MOXA"
    location_prefix: "B网段"
    snmp:
      version: "v2c"
      community: "public"
    ssh:
      username: "admin"
      password: "admin123"
      port: 22
    enabled: true

# ========== 单独定义的交换机 (可选，与 switch_groups 合并) ==========
switches: []

# ========== 服务器 ==========
servers:
  # Windows 服务器示例
  - id: "srv-001"
    name: "SCADA 数据采集服务器"
    ip: "192.168.1.100"
    os_type: "windows"         # windows / linux
    location: "中控室-服务器机柜"
    monitoring:
      method: "agent"          # agent / wmi (Windows) / ssh (Linux)
      ssh:
        username: ""
        password: ""
        port: 22
      agent_port: 9100
    # 需要监控的进程/服务 (覆盖全局默认配置)
    processes:
      - name: "SCADAService"
        port: 8080
        critical: true
      - name: "sqlservr"
        port: 1433
        critical: true
    enabled: true

  # Linux 服务器示例
  - id: "srv-002"
    name: "历史数据服务器"
    ip: "192.168.1.101"
    os_type: "linux"
    location: "中控室-服务器机柜"
    monitoring:
      method: "ssh"
      ssh:
        username: "monitor"
        password: "monitor123"
        port: 22
      agent_port: 9100
    processes:
      - name: "mysqld"
        port: 3306
        critical: true
      - name: "redis-server"
        port: 6379
        critical: false
    enabled: true

# ========== VLAN 规划 (用于自动化配置) ==========
vlan_plan:
  - vlan_id: 10
    name: "Management"
    description: "管理网络"
    subnet: "192.168.10.0/24"
  - vlan_id: 20
    name: "Production"
    description: "生产网络"
    subnet: "192.168.20.0/24"
  - vlan_id: 30
    name: "Monitoring"
    description: "监控网络"
    subnet: "192.168.30.0/24"
  - vlan_id: 100
    name: "SCADA"
    description: "SCADA 专用网络"
    subnet: "192.168.100.0/24"
