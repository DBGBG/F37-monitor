# MOXA 主动运维监控系统 - 全局配置

# 系统设置
system:
  name: "MOXA 主动运维监控系统"
  host: "0.0.0.0"
  port: 8080
  debug: false
  log_level: "INFO"

# 数据库设置
database:
  url: "sqlite+aiosqlite:///./data/moxa_monitor.db"
  echo: false
  pool_size: 10

# SNMP 采集配置
snmp:
  version: "v2c"              # SNMP 版本: v1, v2c, v3
  community: "public"         # SNMP 团体名 (v2c)
  port: 161                   # SNMP 端口
  timeout: 2                  # 单次请求超时 (秒), 设备 RTT 约 0.1s, 2s 足够
  retries: 3                  # 重试次数 (丢包时最多重传 3 次, 保证高并发下不丢数据)
  bulk_size: 50               # GETBULK 每个 PDU 最大行数 (越大往返越少)
  max_concurrent: 32          # 单次 SNMP 请求最大并发数 (降低以减少线程开销, 32已足够覆盖107台设备)
  batch_size: 64              # 每批设备数 (分批处理, 避免一次性并发过多请求)
  poll_intervals:
    port_status: 120           # 端口状态采集间隔 (秒) - 从60s降至120s, 减轻设备负担
    traffic_stats: 300         # 流量统计采集间隔 (秒) - 从120s降至300s, 流量趋势无需高频
    hardware_health: 600       # 硬件健康采集间隔 (秒) - 从300s降至600s, 温度变化缓慢

# SNMPv3 认证 (可选)
snmp_v3:
  auth_protocol: "SHA"
  auth_key: ""
  priv_protocol: "AES"
  priv_key: ""

# SNMP Trap 接收 (事件驱动: 设备主动上报, 秒级感知端口/电源变化)
# 需在各 MOXA 设备上把 Trap 目的地址(trap host)配置为本机 IP
snmp_trap:
  enabled: true              # 关闭则忽略设备上报的 Trap
  port: 162                  # Trap 接收端口 (标准 SNMP Trap 端口)
  min_interval: 5            # 同一设备最小刷新间隔 (秒), 防止 Trap 风暴

# SSH 自动化配置
ssh:
  port: 22
  timeout: 30
  max_concurrent: 5           # 对单台设备最大并发 SSH 会话
  task_queue_size: 100        # 配置任务队列大小

# 服务器监控配置
server_monitor:
  poll_interval: 30           # 服务器指标采集间隔 (秒)
  ssh_port: 22
  agent_port: 9100            # 轻量 Agent 监听端口
  wmi_timeout: 10             # WMI 查询超时 (秒)

# 进程监控配置
process_monitor:
  poll_interval: 60           # 进程检测间隔 (秒)
  # 需要监控的进程/服务列表 (可在 devices.yaml 中按服务器单独配置)
  default_processes:
    - name: "nginx"
      port: 80
    - name: "mysqld"
      port: 3306

# 告警配置
alerts:
  enabled: true
  check_interval: 30          # 告警检查间隔 (秒)
  dedup_window: 300           # 告警去重窗口 (秒)
  rules:
    # 交换机告警规则
    switch_offline:
      severity: "CRITICAL"
      description: "交换机离线(SNMP 不可达)"
    switch_port_down:
      severity: "WARNING"
      description: "交换机端口 Down"
    switch_power_failure:
      severity: "CRITICAL"
      description: "电源故障"
    switch_cpu_high:
      threshold: 90
      severity: "WARNING"
      description: "交换机 CPU 使用率过高"
    # 服务器告警规则
    server_cpu_high:
      threshold: 90
      severity: "WARNING"
      description: "服务器 CPU 使用率过高"
    server_memory_high:
      threshold: 90
      severity: "WARNING"
      description: "服务器内存使用率过高"
    server_disk_high:
      threshold: 90
      severity: "WARNING"
      description: "磁盘空间不足"
    server_process_down:
      severity: "CRITICAL"
      description: "关键进程异常退出"

# 主动运维 (动态基线 / 异常检测 / 健康评分 / 维护窗口)
# 理念: 不依赖固定阈值, 而是学习每台设备自身的"正常基线", 在劣化早期发现偏离
proactive:
  enabled: true
  analyze_interval: 300          # 主动分析间隔 (秒) - 从180s增至300s, 与采集频率匹配
  ewma_alpha: 0.15               # EWMA 平滑系数 (0~1, 越小基线越平稳, 对小波动越不敏感)
  min_samples: 20                # 建立基线所需的最少样本数 (样本不足不判定异常, 避免误报)
  anomaly_k: 4.0                 # z 分数阈值: 偏离基线超过 k 个标准差才判为异常
  outlier_damping: 0.1           # 异常样本对基线的更新阻尼 (0.1=仅用 1/10 学习率, 防止故障值带偏基线)
  dedup_minutes: 30              # 同类异常合并/去重窗口 (分钟), 窗口内持续异常只保留一条
  escalate_severity: "CRITICAL"  # 达到该级别的异常自动升级为告警 (NONE=不升级)
  port_error_window_hours: 2     # 端口误码统计回看窗口 (小时)
  # 各指标异常判定参数: min_deviation=最小绝对偏离, direction=仅关注的方向(up=仅升高)
  metrics:
    temperature: { min_deviation: 8.0,  direction: "up" }
    cpu:         { min_deviation: 20.0, direction: "up" }
    memory:      { min_deviation: 15.0, direction: "up" }
    disk:        { min_deviation: 10.0, direction: "up" }
    port_error:  { min_deviation: 5.0,  direction: "up" }
  # 健康评分扣分权重 (满分 100, 各项按扣分值累减)
  health_weights:
    online: 30                   # 离线直接判为最差
    power: 15                    # 电源故障
    temperature: 15              # 温度异常/过高
    anomalies: 20                # 未处理异常数量
    alerts: 20                   # 活动告警

# 设备点检配置
inspection:
  task_generation_interval: 60   # 点检任务生成/逾期检查间隔 (秒)
  default_grace_hours: 12        # 默认完成时限 (小时)

# 通知配置
notifications:
  email:
    enabled: false
    smtp_host: "smtp.example.com"
    smtp_port: 465
    smtp_ssl: true
    username: ""
    password: ""
    sender: "monitor@example.com"
    recipients:
      - "admin@example.com"

  dingtalk:
    enabled: false
    webhook_url: ""
    secret: ""

# 数据保留策略
retention:
  metrics_days: 30            # 指标数据保留天数
  alerts_days: 90             # 告警记录保留天数
  anomalies_days: 180         # 主动运维异常事件保留天数
  audit_days: 365             # 审计日志保留天数
  inspection_days: 0          # 点检履历保留天数 (0=永久保留)
